<!doctype html>
<html lang="en" data-theme="light" data-brand="kashi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" id="favicon-link" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KashiGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* ══ Calm v4 tokens — RGB triplets, consumed as rgb(var(--x) / <alpha>) ══

         These are the STATIC defaults (Kashi Purple, #936EC8). At runtime
         src/lib/themeEngine.js generates the full light + dark token set for
         whatever colour the user/tenant chose and writes it into
         <style id="kashi-theme-vars">, which comes later in <head> and wins.
         Nothing writes brand/mesh tokens as inline styles any more — inline
         styles outrank [data-theme="dark"] and were the cause of the bright
         pastel wash and pastel buttons in dark mode. */

      /* ── Brand scale — Kashi Purple default ── */
      :root {
        --color-brand-50:  245 243 250;
        --color-brand-100: 231 224 242;
        --color-brand-200: 213 201 232;
        --color-brand-300: 189 171 218;
        --color-brand-400: 161 136 203;
        --color-brand-500: 135 102 188;   /* #936EC8 nudged to clear AA with white */
        --color-brand-600: 113  86 160;
        --color-brand-700:  90  71 131;
        --color-brand-800:  68  55 103;
        --color-brand-900:  45  39  74;
        /* Text/icons ON a solid brand-500 surface. White for a saturated seed,
           a deep same-hue ink for pastels — themeEngine decides per seed. */
        --color-brand-on:  255 255 255;
        /* Progress fills, dots, indicators — ≥ 3:1 against the track. */
        --color-brand-fill: 135 102 188;
        --color-accent:     135 102 188;

        /* Shape */
        --radius-badge: 999px;
        --radius-ctl:   8px;
        --radius-card:  12px;
        --radius-modal: 16px;

        /* Charts (categorical — data-viz only, never status) */
        --chart-1:#0E7C86; --chart-2:#4C6A92; --chart-3:#02C39A; --chart-4:#C9822E;
        --chart-5:#7A5FA8; --chart-6:#B75D69; --chart-7:#5B8DB8; --chart-8:#8B8E63;

        /* Reports (PRINT-STABLE — never theme-dependent) */
        --rpt-ink:#1A2233; --rpt-muted:#5A6B80; --rpt-border:#D9E0E8; --rpt-paper:#FAFBFD;
        --rpt-pass-fg:#166534; --rpt-pass-bg:#DCFCE7; --rpt-pass-bd:#16A34A;
        --rpt-warn-fg:#92400E; --rpt-warn-bg:#FEF3C7; --rpt-warn-bd:#D97706;
        --rpt-high-fg:#9A3412; --rpt-high-bg:#FED7AA; --rpt-high-bd:#EA580C;
        --rpt-crit-fg:#991B1B; --rpt-crit-bg:#FEE2E2; --rpt-crit-bd:#DC2626;
        --rpt-accent:#1D4ED8;  --rpt-accent-bg:#EFF6FF;
        --rpt-white:#FFFFFF;   --rpt-bg-soft:#F3F4F6;

        /* Dark-sidebar option (intentional dark chrome on light theme) */
        --sidebar-dark: #0E1F33;

        /* Constant "on dark chrome" ink — identical in BOTH themes, because
           the dark sidebar stays dark in light mode. Used by bg-on-dark/10,
           text-on-dark, etc. Never swap these per theme. */
        --color-on-dark:      255 255 255;
        --color-on-dark-inv:    0   0   0;
      }

      /* ── LIGHT theme (default) ── */
      :root,
      [data-theme="light"] {
        /* Brand INK — brand-coloured text/icons on neutral surfaces. */
        --color-brand-ink: 113 86 160;
        --color-surface:         247 249 251;
        --color-surface-raised:  255 255 255;
        --color-surface-overlay: 241 244 248;
        --color-surface-inset:   237 241 245;
        --color-border:          226 232 239;
        --color-border-subtle:   236 240 245;
        --color-border-strong:   190 201 214;
        --color-text-primary:     22  40  60;
        --color-text-secondary:   55  73  96;
        /* muted/faint darkened: the old values measured 4.16:1 and 3.51:1 on
           surface-overlay — placeholders, meta text and table captions were
           failing AA across the app. */
        --color-text-muted:       84 102 126;
        --color-text-faint:       90 107 131;
        --color-text-inverse:    255 255 255;
        --color-sidebar:         255 255 255;
        --scrollbar-color:       203 213 225;

        --color-status-pass-bg: 226 244 233; --color-status-pass-fg:  19 104  66;
        --color-status-fail-bg: 252 233 233; --color-status-fail-fg: 168  38  36;
        --color-status-warn-bg: 252 241 217; --color-status-warn-fg: 133  83   6;
        --color-status-info-bg: 224 241 244; --color-status-info-fg:  11  99 108;
        --color-status-pending-bg: 237 241 245; --color-status-pending-fg: 75 90 112;
        --color-status-tag-bg:  239 236 249; --color-status-tag-fg:   88  72 172;

        --shadow-elevated: 0 1px 2px rgb(14 31 51 / .05), 0 4px 14px rgb(14 31 51 / .06);
        --shadow-hover:    0 2px 4px rgb(14 31 51 / .06), 0 10px 24px rgb(14 31 51 / .09);
        --shadow-overlay:  0 12px 40px rgb(14 31 51 / .16);

        /* Glass — frosted in light mode. Fill opacity is what keeps text
           readable over the wash (checked: muted text ≥ 4.5:1 on a card over
           the wash centre for every preset). */
        --glass-bg:    rgb(255 255 255 / .64);
        --glass-bg-hi: rgb(255 255 255 / .84);
        --glass-bd:    rgb(255 255 255 / .72);
        --glass-blur:  24px;
        --overlay-blur: 28px;
        --glass-hl:    inset 0 1px 0 rgb(255 255 255 / .9), inset 0 0 0 1px rgb(255 255 255 / .22);
        --card-bg:     rgb(255 255 255 / .62);
        --card-bd:     rgb(255 255 255 / .75);
        --card-blur:   24px;
        --inset-bg:    rgb(255 255 255 / .5);
        --inset-bd:    rgb(255 255 255 / .65);
        /* Fields: frosted, recessed — translucent fill, inner shadow for
           depth, a white top highlight, and a brand glow on focus. */
        --field-bg:      rgb(255 255 255 / .46);
        --field-bd:      rgb(var(--color-border-strong) / .6);
        --field-bd-hover:rgb(var(--color-border-strong) / .95);
        --field-bg-focus:rgb(255 255 255 / .82);
        --field-bg-in-overlay: rgb(255 255 255 / .62);
        --field-blur:    14px;
        --field-shadow:  inset 0 1px 2px rgb(14 31 51 / .07), inset 0 -1px 0 rgb(255 255 255 / .55);
        --field-shadow-focus: 0 0 0 3px rgb(var(--color-brand-500) / .2), inset 0 1px 2px rgb(14 31 51 / .05);
        --button-glass-bg:       rgb(255 255 255 / .62);
        --button-glass-bd:       rgb(var(--color-border-strong) / .6);
        --button-glass-bg-hover: rgb(255 255 255 / .88);
      }

      /* ── DARK theme ──
         Static fallback = Kashi Purple dark. themeEngine regenerates every
         neutral below from the active theme's own hue at runtime. Glass is
         near-opaque here on purpose: translucent cards over a coloured wash
         were the "too bright, can't read" complaint. */
      [data-theme="dark"] {
        --color-brand-50:  236 229 245; --color-brand-100: 216 203 235;
        --color-brand-200: 192 170 223; --color-brand-300: 170 140 212;
        --color-brand-400: 145 107 199; --color-brand-500: 123  78 188;
        --color-brand-600: 108  65 170; --color-brand-700:  91  55 144;
        --color-brand-800:  47  30  72; --color-brand-900:  33  22  49;
        --color-brand-on:  247 244 251;
        --color-brand-ink: 199 175 233;
        --color-brand-fill: 145 107 199;
        --color-accent:     145 107 199;
        --color-surface:          19  16  22;
        --color-surface-raised:   26  23  31;
        --color-surface-overlay:  35  31  41;
        --color-surface-inset:    15  13  18;
        --color-border:           50  44  58;
        --color-border-subtle:    37  33  44;
        --color-border-strong:    75  65  88;
        --color-text-primary:    239 237 242;
        --color-text-secondary:  205 200 213;
        --color-text-muted:      172 164 182;
        --color-text-faint:      146 138 158;
        --color-text-inverse:     19  16  22;
        --color-sidebar:          14  12  16;
        --scrollbar-color:        67  59  79;
        --sidebar-dark: rgb(12 11 15);

        /* Status pills are SOLID deep tints with light ink (≥ 6:1). */
        --color-status-pass-bg:  20  52  37; --color-status-pass-fg: 142 216 170;
        --color-status-fail-bg:  64  27  30; --color-status-fail-fg: 246 170 168;
        --color-status-warn-bg:  60  44  14; --color-status-warn-fg: 240 200 120;
        --color-status-info-bg:  16  48  55; --color-status-info-fg: 140 210 220;
        --color-status-pending-bg: 40 38 48; --color-status-pending-fg: 190 186 200;
        --color-status-tag-bg:   44  36  76; --color-status-tag-fg:  196 184 244;

        --shadow-elevated: 0 1px 2px rgb(0 0 0 / .35), 0 4px 14px rgb(0 0 0 / .3);
        --shadow-hover:    0 2px 4px rgb(0 0 0 / .35), 0 10px 24px rgb(0 0 0 / .4);
        --shadow-overlay:  0 16px 44px rgb(0 0 0 / .55);

        /* Dark glass: tinted, translucent, blurred — over the dim hue wash,
           so it never glows. Every composite stays dark, so light text keeps
           ≥ 7:1 regardless of what is behind the card. */
        --glass-bg:    rgb(var(--color-surface-raised) / .74);
        --glass-bg-hi: rgb(var(--color-surface-raised) / .9);
        --glass-bd:    rgb(255 255 255 / .08);
        --glass-blur:  24px;
        --overlay-blur: 28px;
        --glass-hl:    inset 0 1px 0 rgb(255 255 255 / .07), inset 0 0 0 1px rgb(255 255 255 / .02);
        --card-bg:     rgb(var(--color-surface-raised) / .62);
        --card-bd:     rgb(255 255 255 / .07);
        --card-blur:   24px;
        --inset-bg:    rgb(255 255 255 / .035);
        --inset-bd:    rgb(255 255 255 / .06);
        --field-bg:      rgb(var(--color-surface-inset) / .5);
        --field-bd:      rgb(255 255 255 / .1);
        --field-bd-hover:rgb(255 255 255 / .2);
        --field-bg-focus:rgb(var(--color-surface-inset) / .78);
        --field-bg-in-overlay: rgb(var(--color-surface-inset) / .6);
        --field-blur:    14px;
        --field-shadow:  inset 0 1px 2px rgb(0 0 0 / .35), inset 0 -1px 0 rgb(255 255 255 / .04);
        --field-shadow-focus: 0 0 0 3px rgb(var(--color-brand-400) / .25), inset 0 1px 2px rgb(0 0 0 / .3);
        --button-glass-bg:       rgb(255 255 255 / .05);
        --button-glass-bd:       rgb(255 255 255 / .1);
        --button-glass-bg-hover: rgb(255 255 255 / .09);

        /* Charts — lifted so series separate from a dark plot area. */
        --chart-1:#4FB8C1; --chart-2:#8FA9D3; --chart-3:#3DDBB4; --chart-4:#E3A75C;
        --chart-5:#B49BE0; --chart-6:#E08E99; --chart-7:#86B3DB; --chart-8:#B9BC8C;

        --mesh-1: rgb(45 27 70); --mesh-2: rgb(33 24 45);
        --mesh-3: rgb(49 27 52); --mesh-4: rgb(24 24 40);
      }

      /* ── LIGHT mesh wash (default) ── */
      :root, [data-theme="light"] {
        --mesh-1: rgb(189 171 218);
        --mesh-2: rgb(231 224 242);
        --mesh-3: rgb(213 201 232);
        --mesh-4: rgb(245 243 250);
      }

      /* ── System theme follows OS (dark branch; light falls through to :root) ── */
      @media (prefers-color-scheme: dark) {
        [data-theme="system"] {
        --color-brand-50:  236 229 245; --color-brand-100: 216 203 235;
        --color-brand-200: 192 170 223; --color-brand-300: 170 140 212;
        --color-brand-400: 145 107 199; --color-brand-500: 123  78 188;
        --color-brand-600: 108  65 170; --color-brand-700:  91  55 144;
        --color-brand-800:  47  30  72; --color-brand-900:  33  22  49;
        --color-brand-on:  247 244 251;
        --color-brand-ink: 199 175 233;
        --color-brand-fill: 145 107 199;
        --color-accent:     145 107 199;
        --color-surface:          19  16  22;
        --color-surface-raised:   26  23  31;
        --color-surface-overlay:  35  31  41;
        --color-surface-inset:    15  13  18;
        --color-border:           50  44  58;
        --color-border-subtle:    37  33  44;
        --color-border-strong:    75  65  88;
        --color-text-primary:    239 237 242;
        --color-text-secondary:  205 200 213;
        --color-text-muted:      172 164 182;
        --color-text-faint:      146 138 158;
        --color-text-inverse:     19  16  22;
        --color-sidebar:          14  12  16;
        --scrollbar-color:        67  59  79;
        --sidebar-dark: rgb(12 11 15);

        /* Status pills are SOLID deep tints with light ink (≥ 6:1). */
        --color-status-pass-bg:  20  52  37; --color-status-pass-fg: 142 216 170;
        --color-status-fail-bg:  64  27  30; --color-status-fail-fg: 246 170 168;
        --color-status-warn-bg:  60  44  14; --color-status-warn-fg: 240 200 120;
        --color-status-info-bg:  16  48  55; --color-status-info-fg: 140 210 220;
        --color-status-pending-bg: 40 38 48; --color-status-pending-fg: 190 186 200;
        --color-status-tag-bg:   44  36  76; --color-status-tag-fg:  196 184 244;

        --shadow-elevated: 0 1px 2px rgb(0 0 0 / .35), 0 4px 14px rgb(0 0 0 / .3);
        --shadow-hover:    0 2px 4px rgb(0 0 0 / .35), 0 10px 24px rgb(0 0 0 / .4);
        --shadow-overlay:  0 16px 44px rgb(0 0 0 / .55);

        /* Dark glass: tinted, translucent, blurred — over the dim hue wash,
           so it never glows. Every composite stays dark, so light text keeps
           ≥ 7:1 regardless of what is behind the card. */
        --glass-bg:    rgb(var(--color-surface-raised) / .74);
        --glass-bg-hi: rgb(var(--color-surface-raised) / .9);
        --glass-bd:    rgb(255 255 255 / .08);
        --glass-blur:  24px;
        --overlay-blur: 28px;
        --glass-hl:    inset 0 1px 0 rgb(255 255 255 / .07), inset 0 0 0 1px rgb(255 255 255 / .02);
        --card-bg:     rgb(var(--color-surface-raised) / .62);
        --card-bd:     rgb(255 255 255 / .07);
        --card-blur:   24px;
        --inset-bg:    rgb(255 255 255 / .035);
        --inset-bd:    rgb(255 255 255 / .06);
        --field-bg:      rgb(var(--color-surface-inset) / .5);
        --field-bd:      rgb(255 255 255 / .1);
        --field-bd-hover:rgb(255 255 255 / .2);
        --field-bg-focus:rgb(var(--color-surface-inset) / .78);
        --field-bg-in-overlay: rgb(var(--color-surface-inset) / .6);
        --field-blur:    14px;
        --field-shadow:  inset 0 1px 2px rgb(0 0 0 / .35), inset 0 -1px 0 rgb(255 255 255 / .04);
        --field-shadow-focus: 0 0 0 3px rgb(var(--color-brand-400) / .25), inset 0 1px 2px rgb(0 0 0 / .3);
        --button-glass-bg:       rgb(255 255 255 / .05);
        --button-glass-bd:       rgb(255 255 255 / .1);
        --button-glass-bg-hover: rgb(255 255 255 / .09);

        /* Charts — lifted so series separate from a dark plot area. */
        --chart-1:#4FB8C1; --chart-2:#8FA9D3; --chart-3:#3DDBB4; --chart-4:#E3A75C;
        --chart-5:#B49BE0; --chart-6:#E08E99; --chart-7:#86B3DB; --chart-8:#B9BC8C;

        --mesh-1: rgb(45 27 70); --mesh-2: rgb(33 24 45);
        --mesh-3: rgb(49 27 52); --mesh-4: rgb(24 24 40);
        }
      }

      /* ── Alias layer: short names used by policy styles, reports,
            charts, and inline style props ── */
      :root, [data-theme="light"], [data-theme="dark"], [data-theme="system"] {
        --surface:         rgb(var(--color-surface));
        --surface-raised:  rgb(var(--color-surface-raised));
        --surface-overlay: rgb(var(--color-surface-overlay));
        --surface-inset:   rgb(var(--color-surface-inset));
        --border:          rgb(var(--color-border));
        --border-subtle:   rgb(var(--color-border-subtle));
        --text-primary:    rgb(var(--color-text-primary));
        --text-secondary:  rgb(var(--color-text-secondary));
        --text-muted:      rgb(var(--color-text-muted));
        --text-faint:      rgb(var(--color-text-faint));
        --status-pass-fg:  rgb(var(--color-status-pass-fg));
        --status-pass-bg:  rgb(var(--color-status-pass-bg));
        --status-fail-fg:  rgb(var(--color-status-fail-fg));
        --status-fail-bg:  rgb(var(--color-status-fail-bg));
        --status-warn-fg:  rgb(var(--color-status-warn-fg));
        --status-warn-bg:  rgb(var(--color-status-warn-bg));
        --status-info-fg:  rgb(var(--color-status-info-fg));
        --status-info-bg:  rgb(var(--color-status-info-bg));
        --status-tag-fg:   rgb(var(--color-status-tag-fg));
        --status-tag-bg:   rgb(var(--color-status-tag-bg));
        --status-pending-fg: rgb(var(--color-status-pending-fg));
        --status-pending-bg: rgb(var(--color-status-pending-bg));
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      html { color-scheme: light; }
      html[data-theme="dark"] { color-scheme: dark; }
      @media (prefers-color-scheme: dark) { html[data-theme="system"] { color-scheme: dark; } }
      body {
        font-family: 'Albert Sans', system-ui, sans-serif;
        background:
          radial-gradient(50% 55% at 12% 8%,  var(--mesh-1), transparent 70%),
          radial-gradient(45% 50% at 88% 15%, var(--mesh-3), transparent 68%),
          radial-gradient(55% 60% at 70% 95%, var(--mesh-2), transparent 70%),
          radial-gradient(40% 45% at 30% 80%, var(--mesh-4), transparent 65%),
          rgb(var(--color-surface));
        background-attachment: fixed;
        color: rgb(var(--color-text-primary));
        -webkit-font-smoothing: antialiased;
        font-feature-settings: 'tnum' 1;
      }

      /* Dark theme: four dim glows in the theme's own hue. Deep enough that
         nothing glares; present enough that frosted glass reads as glass. */
      html[data-theme="dark"] body {
        background:
          radial-gradient(48% 52% at 8% 4%,   var(--mesh-1), transparent 66%),
          radial-gradient(42% 46% at 94% 12%, var(--mesh-3), transparent 64%),
          radial-gradient(50% 55% at 76% 98%, var(--mesh-2), transparent 66%),
          radial-gradient(38% 42% at 22% 86%, var(--mesh-4), transparent 62%),
          rgb(var(--color-surface));
        background-attachment: fixed;
      }
      @media (prefers-color-scheme: dark) {
        html[data-theme="system"] body {
          background:
            radial-gradient(48% 52% at 8% 4%,   var(--mesh-1), transparent 66%),
            radial-gradient(42% 46% at 94% 12%, var(--mesh-3), transparent 64%),
            radial-gradient(50% 55% at 76% 98%, var(--mesh-2), transparent 66%),
            radial-gradient(38% 42% at 22% 86%, var(--mesh-4), transparent 62%),
            rgb(var(--color-surface));
          background-attachment: fixed;
        }
      }

      /* Scrollbar adapts to theme */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgb(var(--scrollbar-color)); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgb(var(--color-border-strong)); }
    </style>
    <script>
      (function () {
        /* One-time theme migration — runs before ANY module (useTheme reads
           localStorage at import time, so this must be an inline head script).

           Only a browser that carries PRE-v3 theme keys is reset. The old
           version of this block also fired on every brand-new browser — so a
           user signing in on a new laptop had the theme they had saved pushed
           back to the defaults in the database. A fresh browser is now just
           stamped with the current version. */
        var KEY = 'kashi_theme_migration', VERSION = 'v3-calm-2';
        try {
          var seen = localStorage.getItem(KEY);
          if (seen !== VERSION) {
            var legacy = seen !== null ||
              localStorage.getItem('kashi_theme') !== null ||
              localStorage.getItem('kashi_sidebar_theme') !== null;
            if (legacy) {
              ['kashi_theme', 'kashi_sidebar_theme',
               'kashi_brand_preset'].forEach(function (k) { localStorage.removeItem(k) });
              /* The DB holds pre-v3 prefs and bootstrap would restore them;
                 this flag tells useUIConfig to PUSH the new defaults up once. */
              localStorage.setItem('kashi_theme_reset_pending', '1');
            }
            localStorage.setItem(KEY, VERSION);
          }
        } catch (e) {}

        /* One-time brand reset for this release: everyone back to Kashi
           Purple. Clears only this browser's cached COLOUR (not light/dark or
           sidebar style); the matching server-side reset is
           db/one-off/2026-10-22-reset-brand-colour-to-kashi-purple.sql.
           A colour picked after this runs is saved normally and persists —
           the version stamp means it is never cleared again. Bump
           BRAND_RESET_VERSION to repeat this in a future release. */
        var BRAND_RESET_KEY = 'kashi_brand_reset', BRAND_RESET_VERSION = 'kashi-purple-2026-10';
        try {
          if (localStorage.getItem(BRAND_RESET_KEY) !== BRAND_RESET_VERSION) {
            ['kashi_brand_preset', 'kashi_sidebar_color', 'kashi_theme_css', 'kashi_theme_seed']
              .forEach(function (k) { localStorage.removeItem(k) });
            localStorage.setItem(BRAND_RESET_KEY, BRAND_RESET_VERSION);
          }
        } catch (e) {}

        /* Paint the user's theme BEFORE React renders (no flash on reload).
           src/lib/themeEngine.js caches the exact stylesheet it generated;
           we inject it verbatim, so there is no second copy of the colour
           maths to drift out of sync. No cache yet → the static Kashi Purple
           defaults above apply until the bundle paints. */
        try {
          var css = localStorage.getItem('kashi_theme_css');
          if (css) {
            var el = document.createElement('style');
            el.id = 'kashi-theme-vars';
            el.textContent = css;
            document.head.appendChild(el);
          }
          var key = localStorage.getItem('kashi_brand_preset');
          if (key) document.documentElement.setAttribute('data-brand', key);
          var t = localStorage.getItem('kashi_theme');
          if (t === 'dark' || t === 'light' || t === 'system') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Boot skeleton: the app's shape (sidebar, top bar, tabs, page blocks),
         drawn before any JavaScript runs, so a refresh never shows a blank
         screen while the bundle loads. React replaces it on its first render.
         Signed-in app pages only — the login and guest join pages draw their
         own. Colours come from the theme variables painted above. -->
    <style>
      #boot{position:fixed;inset:0;display:flex;gap:8px;padding:8px;box-sizing:border-box}
      #boot .b{background:rgb(var(--color-surface-raised)/.62);border:1px solid rgb(var(--color-border)/.7);border-radius:var(--radius-card)}
      #boot .s{width:240px;flex:none}
      #boot.brand .s{background:rgb(var(--color-brand-500));border-color:transparent}
      #boot .m{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
      #boot .t{height:48px;flex:none}
      #boot .tabs{height:30px;width:42%;flex:none;opacity:.7}
      #boot .p{flex:1;padding:22px;display:flex;flex-direction:column;gap:14px}
      #boot .l{height:14px;border-radius:6px;background:rgb(var(--color-surface-overlay));animation:bootp 1.4s ease-in-out infinite}
      #boot .row{display:flex;gap:12px}
      #boot .k{flex:1;height:84px;border-radius:var(--radius-card);background:rgb(var(--color-surface-overlay));animation:bootp 1.4s ease-in-out infinite}

      @media (prefers-reduced-motion:reduce){#boot .l,#boot .k{animation:none}}
      @media (max-width:768px){#boot .s{display:none}}
    </style>
    <div id="root"><script>
      (function () {
        try {
          var p = location.pathname;
          var signedIn = !!(sessionStorage.getItem('kashi_auth') || localStorage.getItem('kashi_auth'));
          if (!signedIn || p.indexOf('/auth/') === 0 || p.indexOf('/join/') === 0 || p === '/verify-audit-firm') return;
          var brand = localStorage.getItem('kashi_sidebar_theme') === 'brand';
          document.write('<div id="boot" aria-hidden="true"' + (brand ? ' class="brand"' : '') + '>'

            + '<div class="l" style="width:92%"></div><div class="l" style="width:84%"></div><div class="l" style="width:70%"></div>'
            + '<div class="k" style="flex:none;height:200px"></div></div></div></div>');
        } catch (e) {}
      })();
    </script></div>
